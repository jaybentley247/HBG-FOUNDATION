<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Admin Panel - Hope Bridge{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary px-4 mb-4">
    <a class="navbar-brand mb-0 h1" href="{{ url_for('main.admin_dashboard') }}">Admin Dashboard</a>
    <a href="{{ url_for('main.admin_logout') }}" class="btn btn-outline-light btn-sm">Logout</a>
  </nav>

  <div class="container py-4">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
