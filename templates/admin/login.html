<!DOCTYPE html>
<html lang="en">
<head>
  <title>Admin Login - Hope Bridge</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1 0 auto; }
    .admin-header .site-logo { height: 44px; width: auto; }
    .admin-footer { background: #1f2937; color: #cbd5e1; padding: 24px 0; font-size: 0.9rem; }
  </style>
</head>
<body class="bg-light">
{% include "partials/loader.html" %}

  <!-- Header -->
  <header class="admin-header bg-white shadow-sm py-2">
    <div class="container d-flex align-items-center justify-content-between">
      <a href="{{ url_for('main.index') }}" class="navbar-brand d-flex align-items-center text-decoration-none">
        <img src="{{ url_for('static', filename='images/logo-mark.png') }}" alt="Hope Bridge Foundation" class="site-logo me-2">
        <span class="fw-bold text-primary">Admin Portal</span>
      </a>
      <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary btn-sm">
        <i class="fas fa-arrow-left me-1"></i> Back to Site
      </a>
    </div>
  </header>

  <!-- Login form -->
  <main class="container d-flex justify-content-center align-items-center py-5">
    <div class="card shadow" style="width: 400px;">
      <div class="card-header bg-primary text-white text-center">
        <h4 class="mb-0">Admin Login</h4>
      </div>
      <div class="card-body">
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="alert alert-danger">{{ messages[0] }}</div>
          {% endif %}
        {% endwith %}
        <form method="post">
          <div class="mb-3">
            <label>Username</label>
            <input type="text" name="username" class="form-control" autocomplete="username" required>
          </div>
          <div class="mb-3">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="admin-footer">
    <div class="container d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2">
      <span>&copy; {{ now_year }} Hope Bridge Foundation. All rights reserved.</span>
      <span class="text-muted">Authorized personnel only</span>
    </div>
  </footer>
</body>
</html>
