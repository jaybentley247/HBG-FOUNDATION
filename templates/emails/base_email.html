<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin: 0; padding: 0; background-color: #f4f6f9; font-family: Arial, sans-serif; color: #333333;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f4f6f9; padding: 30px 15px;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
                    
                    <!-- HEADER -->
                    <tr>
                        <td style="background-color: #ffffff; padding: 22px; text-align: center; border-bottom: 3px solid #0d6efd;">
                            {% if logo_url %}
                            <img src="{{ logo_url }}" alt="Hope Bridge Foundation" width="240" style="max-width: 240px; height: auto; display: inline-block;">
                            {% else %}
                            <h1 style="margin: 0; color: #0d3b73; font-size: 24px; letter-spacing: 0.5px;">
                                Hope Bridge Foundation
                            </h1>
                            {% endif %}
                        </td>
                    </tr>

                    <!-- BODY CONTENT -->
                    <tr>
                        <td style="padding: 35px 30px; line-height: 1.6; font-size: 16px;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>

                    <!-- FOOTER -->
                    <tr>
                        <td style="background-color: #f8f9fa; padding: 20px 30px; text-align: center; font-size: 12px; color: #6c757d; border-top: 1px solid #e9ecef;">
                            <p style="margin: 0 0 8px 0;">&copy; {{ now_year or 2026 }} Hope Bridge Foundation. All rights reserved.</p>
                            <p style="margin: 0;">Need help? Contact us at <a href="mailto:grants@hopebridge.org" style="color: #0d6efd; text-decoration: none;">grants@hopebridge.org</a></p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
